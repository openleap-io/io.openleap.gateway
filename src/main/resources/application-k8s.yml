server:
  port: 8080

spring:
  cloud:
    config:
      enabled: false
  config:
    import: "optional:file:/config/application-routes.yml"
  security:
    oauth2:
      client:
        provider:
          openleap:
            issuer-uri: ${KEYCLOAK_ISSUER_URI}
            jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}
            token-uri: ${KEYCLOAK_TOKEN_URI}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL}

gateway:
  security:
    allowed-services:
      - /actuator/**

eureka:
  client:
    enabled: false

client-registration:
  enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
